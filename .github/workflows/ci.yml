name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@2a18d0513237e407dd142a9dd428480f84532822 # v1.207.0
        with:
          ruby-version: "3.3"
      - name: Check formula syntax
        run: ruby -c Formula/coreblow.rb
